services:
  - type: web
    name: tourist-guide-web
    runtime: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 180 --chdir Backend app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
