services:
  - type: web
    name: tourist-guide
    runtime: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: gunicorn --chdir Backend app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
